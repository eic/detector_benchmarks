deploy_results:
  allow_failure: true
  stage: deploy
  needs: []
  before_script:
    - source bin/env.sh
    - source ${DETECTOR_PREFIX}/bin/thisepic.sh
  script:
    - snakemake $SNAKEMAKE_FLAGS --cores 1 results/metadata.json
    - find results -print | sort | tee summary.txt
    - mv results pipeline-$CI_PIPELINE_ID; tar cf pipeline-$CI_PIPELINE_ID.tar pipeline-$CI_PIPELINE_ID/; mv pipeline-$CI_PIPELINE_ID results
    - rucio upload --rse E1_BNL_DISK_1 --scope ${DEPLOY_RESULTS_SCOPE} pipeline-$CI_PIPELINE_ID.tar
    - rucio did content add --to-did ${DEPLOY_RESULTS_SCOPE}:VALIDATION_INBOX ${DEPLOY_RESULTS_SCOPE}:pipeline-$CI_PIPELINE_ID.tar
  retry:
    max: 2
    when:
      - runner_system_failure

