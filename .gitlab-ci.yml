image: ${BENCHMARKS_REGISTRY}/${BENCHMARKS_CONTAINER}${BENCHMARKS_SIGIL}${BENCHMARKS_TAG}

variables:
  DETECTOR: epic
  DETECTOR_CONFIG: epic_craterlake
  DETECTOR_PREFIX: /opt/detector/epic-main
  GITHUB_PR: ''
  GITHUB_REPOSITORY: ''
  GITHUB_SHA: ''
  SNAKEMAKE_FLAGS: '--cache'

workflow:
  name: '$PIPELINE_NAME'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "webide"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'

default:
  tags:
    - phy-scratch
  artifacts:
    expire_in: 72 hours 
    paths:
      - .local/lib
      - .local/bin
      - .local/include
      - .snakemake/log
      - logs
      - results
      - config
      - .env
      - summary.txt
    reports:
      dotenv: .env
    when: always

stages:
  - status-pending
  - config
  - initialize
  - simulate
  - calibrate
  - benchmarks
  - collect
  - deploy
  - status-report

.status:
  image: curlimages/curl:latest
  rules:
    - if: $GITHUB_SHA !~ /^$/ # when GITHUB_SHA non-empty
  script:
    - |
      curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: token ${GITHUB_REPO_STATUS_TOKEN}" \
        "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
        -d '{"state":"'"${STATE}"'",
             "target_url":"'"${CI_PIPELINE_URL}"'",
             "description":"'"$(TZ=America/New_York date)"'",
             "context":"eicweb/detector_benchmarks ('"${BENCHMARKS_TAG}"', '"$DETECTOR_CONFIG"')"
            }' ;
  retry:
    max: 2
    when:
      - runner_system_failure


