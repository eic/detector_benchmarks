sim:pfa_validation:
  extends: .det_benchmark
  stage: simulate
  parallel:
    matrix:
      - PARTICLE: ["e-", "pi-", "gamma"]
        ENERGY: ["1GeV", "5GeV", "10GeV", "20GeV", "50GeV"]
        PHASE_SPACE: ["forward", "barrel", "backward"]
  script:
    - |
      snakemake $SNAKEMAKE_FLAGS --cores 1 \
        sim_output/pfa_validation/single/epic_craterlake/${PARTICLE}_${ENERGY}_${PHASE_SPACE}_rec.edm4eic.root

sim:pfa_validation_multi:
  extends: .det_benchmark
  stage: simulate
  parallel:
    matrix:
      - EVENT_TYPE: ["dijet", "hadrons", "emshower"]
        ENERGY: ["10GeV", "20GeV", "50GeV"]
  script:
    - |
      snakemake $SNAKEMAKE_FLAGS --cores 1 \
        sim_output/pfa_validation/multi/epic_craterlake/${EVENT_TYPE}_${ENERGY}_rec.edm4eic.root

bench:pfa_validation:
  extends: .det_benchmark
  stage: benchmarks
  needs:
    - ["sim:pfa_validation", "sim:pfa_validation_multi"]
  script:
    - snakemake $SNAKEMAKE_FLAGS --cores $MAX_CORES_PER_JOB pfa_validation_local

collect_results:pfa_validation:
  extends: .det_benchmark
  stage: collect
  needs:
    - "bench:pfa_validation"
  script:
    - ls -lrht
    - mv results{,_save}/ # move results directory out of the way to preserve it
    - snakemake $SNAKEMAKE_FLAGS --cores 1 --delete-all-output pfa_validation_local
    - mv results{_save,}/
