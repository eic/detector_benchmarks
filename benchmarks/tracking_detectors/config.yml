tracking_detectors:sim_track_hits:
  extends: .det_benchmark
  stage: simulate
  script:
    - snakemake $SNAKEMAKE_FLAGS --cores 1 sim_output/tracking_detectors/{DETECTOR_CONFIG}/sim_track_hits.edm4hep.root

tracking_detectors:plot_hits:
  extends: .det_benchmark
  stage: benchmarks
  needs:
    - ["tracking_detectors:sim_track_hits"]
  script:
    - snakemake $SNAKEMAKE_FLAGS --cores 1 results/tracking_detectors/sim_track_hits_theta.pdf
